name: Build C++ ImGui UI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build C++ Native Lib
        run: |
          mkdir -p src/main/cpp/build
          cd src/main/cpp/build
          cmake ..
          cmake --build . --config Release
        shell: bash

      - name: Copy Native Lib to Resources
        run: |
          mkdir -p src/main/resources
          cp src/main/cpp/build/Release/*native-lib*.dll src/main/resources/ || true
        shell: bash

      - name: Build Desktop Distribution
        run: gradle packageReleaseDistributionForCurrentOS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/compose/binaries/main/app/