name: Build and Release PC Version

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: Build Desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java (Zulu JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: '3.22.x'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        if: runner.os != 'Windows'

      # Build native library (C++)
      - name: Build C++ Native Lib
        run: |
          mkdir -p src/main/cpp/build
          cd src/main/cpp/build
          cmake ..
          cmake --build .

      # Copy built library to resources so it's packaged in the jar (Adjust extensions per OS if needed)
      - name: Copy Native Lib to Resources
        run: |
          mkdir -p src/main/resources
          cp src/main/cpp/build/*native-lib* src/main/resources/ || true
        shell: bash

      - name: Build Compose Desktop Distribution
        run: ./gradlew packageReleaseDistributionForCurrentOS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: desktop-builds-${{ matrix.os }}
          path: build/compose/binaries/main/app/*.*

  create-release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            desktop-builds-windows-latest/*.msi
            desktop-builds-windows-latest/*.exe
            desktop-builds-macos-latest/*.dmg
            desktop-builds-ubuntu-latest/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}