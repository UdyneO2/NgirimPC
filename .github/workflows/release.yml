name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag versi rilis (contoh: v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Tentukan versi
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qiE 'alpha|beta|rc'; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi

      - name: Configure
        shell: bash
        run: cmake -S . -B build -A x64 "-DNGIRIMPC_VERSION=${{ steps.ver.outputs.name }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Siapkan aset (exe + SHA-256)
        id: asset
        shell: pwsh
        run: |
          $TAG = "${{ steps.ver.outputs.tag }}"
          $EXE_NAME = "NgirimPC-$TAG.exe"
          
          Copy-Item build/Release/NgirimPC.exe $EXE_NAME
          $h = (Get-FileHash $EXE_NAME -Algorithm SHA256).Hash.ToLower()
          "$h  $EXE_NAME" | Out-File -FilePath "$EXE_NAME.sha256" -Encoding ascii
          Write-Host "SHA-256: $h"

      - name: Catatan rilis dari CHANGELOG
        shell: bash
        run: |
          awk -v t="${{ steps.ver.outputs.tag }}" '/^## /{f=(index($0,"## " t " ")>0 || $0=="## " t)} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || cp CHANGELOG.md notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: NgirimPC ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ steps.ver.outputs.pre == 'true' }}
          files: |
            NgirimPC-${{ steps.ver.outputs.tag }}.exe
            NgirimPC-${{ steps.ver.outputs.tag }}.exe.sha256
