name: Build and Release PC Version

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: Build Desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Wajib menggunakan ketiga OS ini agar .exe, .dmg, dan .deb bisa di-build
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java (Zulu JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      # Action setup-cmake dihapus karena CMake sudah otomatis tersedia di GitHub Runners

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        if: runner.os != 'Windows'

      - name: Build C++ Native Lib
        run: |
          mkdir -p src/main/cpp/build
          cd src/main/cpp/build
          cmake ..
          cmake --build .

      - name: Copy Native Lib to Resources
        run: |
          mkdir -p src/main/resources
          cp src/main/cpp/build/*native-lib* src/main/resources/ || true
        shell: bash

      - name: Build Compose Desktop Distribution
        run: ./gradlew packageReleaseDistributionForCurrentOS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-builds-${{ matrix.os }}
          path: build/compose/binaries/main/app/

  create-release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-builds-windows-latest/*.msi
            desktop-builds-windows-latest/*.exe
            desktop-builds-macos-latest/*.dmg
            desktop-builds-ubuntu-latest/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
