name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag versi rilis (contoh: v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Tentukan versi dan nama file
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.]+)?$'; then
            echo "Tag '$TAG' tidak valid. Gunakan format vX.Y.Z atau vX.Y.Z-alpha.1"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "exe=NgirimPC-$TAG.exe" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qE -- '-(alpha|beta|rc)'; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi

      - name: Configure
        shell: bash
        run: cmake -S . -B build -A x64 "-DNGIRIMPC_VERSION=${{ steps.ver.outputs.name }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Siapkan aset (exe + SHA-256)
        shell: pwsh
        env:
          EXE: ${{ steps.ver.outputs.exe }}
        run: |
          if (-not (Test-Path build/Release/NgirimPC.exe)) { throw "build/Release/NgirimPC.exe tidak ditemukan" }
          Copy-Item build/Release/NgirimPC.exe $env:EXE
          $h = (Get-FileHash $env:EXE -Algorithm SHA256).Hash.ToLower()
          "$h  $env:EXE" | Out-File -FilePath "$env:EXE.sha256" -Encoding ascii
          Write-Host "SHA-256: $h"

      - name: Bangun installer (Inno Setup)
        shell: pwsh
        env:
          EXE: ${{ steps.ver.outputs.exe }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.name }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup tidak ditemukan" }
          & $iscc "/DMyVersion=$env:VER" "/DMyExe=$env:EXE" "/DMyOut=NgirimPC-Setup-$env:TAG" installer\NgirimPC.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC gagal" }
          $setup = "NgirimPC-Setup-$env:TAG.exe"
          Move-Item "dist\$setup" $setup
          $h = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$h  $setup" | Out-File -FilePath "$setup.sha256" -Encoding ascii

      - name: Catatan rilis dari CHANGELOG
        shell: bash
        run: |
          awk -v t="${{ steps.ver.outputs.tag }}" '/^## /{f=(index($0,"## " t " ")>0 || $0=="## " t)} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || cp CHANGELOG.md notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: NgirimPC ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ steps.ver.outputs.pre == 'true' }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.ver.outputs.exe }}
            ${{ steps.ver.outputs.exe }}.sha256
            NgirimPC-Setup-${{ steps.ver.outputs.tag }}.exe
            NgirimPC-Setup-${{ steps.ver.outputs.tag }}.exe.sha256
