name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unggah exe untuk dicoba
        uses: actions/upload-artifact@v4
        with:
          name: NgirimPC-exe
          path: build/Release/NgirimPC.exe
